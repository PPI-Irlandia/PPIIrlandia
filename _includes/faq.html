<!-- About Hackathon Section -->
<section id="about-hackathon" class="about-hackathon">
    <div class="content-wrapper">
        <div class="col-md-8 col-md-offset-2">
            <h3>{{ site.faqBlockTitle }}</h3>
            <!-- Accordion FAQ -->
            <div class="accordion accordion-flush" id="accordionExample">
                {% for item in site.data.faq %}
                <div class="accordion-item mb-4 shadow-sm">
                    <h2 class="accordion-header" id="heading{{ forloop.index }}">
                        <button
                                class="accordion-button collapsed bg-transparent fw-bold text-start"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#collapse{{ forloop.index }}"
                                aria-expanded="false"
                                aria-controls="collapse{{ forloop.index }}"
                        >
                            {{ item.question }}
                        </button>
                    </h2>
                    <div id="collapse{{ forloop.index }}" class="accordion-collapse collapse" aria-labelledby="heading{{ forloop.index }}">
                        <div class="accordion-body text-start">
                            {{ item.answer | markdownify }}
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>


            <p>Have a look at our Guidebook for Incoming Students! Having trouble viewing? <a href="{{ site.baseurl }}/img/guidebook/Guidebook PPI Irlandia 2022 Edisi 3.pdf" target="_blank" rel="noopener noreferrer">Download</a> instead.
            <object data="{{ site.baseurl }}/img/guidebook/Guidebook PPI Irlandia 2022 Edisi 3.pdf" type="application/pdf" width="100%" height="625px" style="margin-top: 20px">
                <p>Unable to display PDF file. <a href="{{ site.baseurl }}/img/guidebook/Guidebook PPI Irlandia 2022 Edisi 3.pdf" target="_blank" rel="noopener noreferrer">Download</a> instead.</p>
            </object>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- End About Hackathon Section -->
