<section id="about-hackathon" class="about-hackathon">
  <div class="content-wrapper">
    <div class="container">
      <h3>{{ site.decorumTitle }}</h3>
      {% for row in site.decorumRows %}
      {% assign isEven = forloop.index0 | modulo:2 %}
      <div class="row align-items-center my-4 flex-column flex-md-row {% if isEven == 1 %}flex-md-row-reverse{% endif %}">
        
        <!-- Image Column -->
        <div class="col-md-6 mb-3 mb-md-0">
          <img 
            src="{{ site.baseurl }}/img/PPI_Images/{{ row.image }}" 
            alt="{{ row.title }}"
            class="img-fluid"
            style="border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); width: 100%;">
        </div>

        <!-- Text Column -->
        <div class="col-md-6">
          <h4><b>{{ row.title }}</b></h4>
          <p>{{ row.details }}</p>
        </div>
      </div>
      {% endfor %}

      <!-- Organization Profile -->
      <div class="mx-auto" style="max-width: 1000px; padding: 2rem">
        <h6><b>Have a look at our Organization Profile below!</b></h6>

        <div style="margin-bottom: 1rem;">
          <button onclick="switchPDF('id')" class="btn-pdf">Indonesian</button>
          <button onclick="switchPDF('en')" class="btn-pdf">English</button>
        </div>

        <iframe
                id="pdfViewer"
                src="{{ site.baseurl }}/img/about-section/Profil_Organisasi_ID.pdf"
                style="width:100%; height:540px; border: none;"
        ></iframe>

        <!-- Direct download fallback link for mobile browsers -->
        <p style="margin-top: 10px;">
          <a id="downloadLink" href="{{ site.baseurl }}/img/about-section/Profil_Organisasi_ID.pdf" target="_blank">
            📄 Open PDF in new tab (mobile-friendly)
          </a>
        </p>
      </div>

      <script>
        function switchPDF(lang) {
          const base = "{{ site.url | default: site.github.url }}{{ site.baseurl }}";

          const files = {
            id: `${base}/img/about-section/Profil_Organisasi_ID.pdf`,
            en: `${base}/img/about-section/Profil_Organisasi_EN.pdf`
          };

          document.getElementById("pdfViewer").src = files[lang];
          document.getElementById("downloadLink").href = files[lang];
        }
      </script>

      <style>
        .btn-pdf {
          padding: 8px 14px;
          border: none;
          background: #007bff;
          color: white;
          cursor: pointer;
          margin-right: 8px;
          border-radius: 5px;
        }
        .btn-pdf:hover {
          background: #0056b3;
        }
      </style>
    </div>
  </div>
</section>
