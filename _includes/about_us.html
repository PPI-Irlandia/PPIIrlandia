<section id="about-hackathon" class="about-hackathon">
  <div class="content-wrapper">
    <div class="container">
      <h3>{{ site.decorumTitle }}</h3>
      {% for row in site.decorumRows %}
      {% assign isEven = forloop.index0 | modulo:2 %}
      <div class="row align-items-center my-4 flex-column flex-md-row {% if isEven == 1 %}flex-md-row-reverse{% endif %}">
        
        <!-- Image Column -->
        <div class="col-md-6 mb-3 mb-md-0">
          <img 
            src="{{ site.baseurl }}/img/PPI_Images/{{ row.image }}" 
            alt="{{ row.title }}"
            class="img-fluid"
            style="border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); width: 100%;">
        </div>

        <!-- Text Column -->
        <div class="col-md-6">
          <h4><b>{{ row.title }}</b></h4>
          <p>{{ row.details }}</p>
        </div>
      </div>
      {% endfor %}

      <!-- Organization Profile -->
      <div class="mx-auto" style="max-width: 1000px; padding: 2rem">
        <h6><b>
          Have a look at our Organization Profile below or click
          <a href="{{ site.baseurl }}/img/about-section/Profil_Organisasi_Edisi_1.pdf"
             target="_blank" rel="noopener noreferrer">here</a>!
        </b></h6>

        <iframe
                src="https://docs.google.com/viewer?url={{ site.url }}{{ site.baseurl }}/img/about-section/Profil_Organisasi_Edisi_1.pdf&embedded=true"
                style="width:100%; height:625px;">
        </iframe>
      </div>
    </div>
  </div>
</section>
