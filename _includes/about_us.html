<section id="about-hackathon" class="about-hackathon">
  <div class="content-wrapper">
    <div class="container">
      <h3>{{ site.decorumTitle }}</h3>
      {% for row in site.decorumRows %}
      {% assign isEven = forloop.index0 | modulo:2 %}
      <div class="row align-items-center my-4 flex-column flex-md-row {% if isEven == 1 %}flex-md-row-reverse{% endif %}">
        
        <!-- Image Column -->
        <div class="col-md-6 mb-3 mb-md-0">
          <img 
            src="{{ site.baseurl }}/img/PPI_Images/{{ row.image }}" 
            alt="{{ row.title }}"
            class="img-fluid"
            style="border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); width: 100%;">
        </div>

        <!-- Text Column -->
        <div class="col-md-6">
          <h4><b>{{ row.title }}</b></h4>
          <p>{{ row.details }}</p>
        </div>
      </div>
      {% endfor %}

      <!-- Organization Profile -->
      <div class="mx-auto" style="max-width: 1000px; padding: 2rem">
        <h6><b>
          Have a look at our Organization Profile below!
        </b></h6>

        <!-- Language Switch Buttons -->
        <div style="margin-bottom: 1rem;">
          <button onclick="switchPDF('id')" class="btn-pdf">Indonesian</button>
          <button onclick="switchPDF('en')" class="btn-pdf">English</button>
        </div>

        <!-- PDF Frame -->
        <iframe
                id="pdfViewer"
                src="https://docs.google.com/viewer?url={{ site.url }}{{ site.baseurl }}/img/about-section/Profil_Organisasi_ID.pdf&embedded=true"
                style="width:100%; height:540px;"
        ></iframe>
      </div>

      <script>
        function switchPDF(lang) {
          const viewer = document.getElementById("pdfViewer");

          // Map language → correct file
          const pdfFiles = {
            id: "{{ site.url }}{{ site.baseurl }}/img/about-section/Profil_Organisasi_ID.pdf",
            en: "{{ site.url }}{{ site.baseurl }}/img/about-section/Profil_Organisasi_EN.pdf"
          };

          viewer.src = `https://docs.google.com/viewer?url=${pdfFiles[lang]}&embedded=true`;
        }
      </script>

      <!-- button styling -->
      <style>
        .btn-pdf {
          padding: 8px 14px;
          border: none;
          background: #007bff;
          color: white;
          cursor: pointer;
          margin-right: 8px;
          border-radius: 5px;
        }

        .btn-pdf:hover {
          background: #0056b3;
        }
      </style>
    </div>
  </div>
</section>
